[env:ODG_S3_BRUCE_FULL]
board = ODG_S3_BRUCE_FULL
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/ODG_S3_BRUCE_FULL>
lib_deps = ${env.lib_deps}
build_flags =
	${env.build_flags}
	-Iboards/ODG_S3_BRUCE_FULL
	-DUSB_as_HID=1
	-DDEVICE_NAME='"ODG S3 Bruce Full"'
	-DODG_S3_BRUCE_FULL=1
	-DHAS_SCREEN=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DROTATION=1
	-DTFT_CS=14
	-DTFT_DC=47
	-DTFT_RST=21
	-DTFT_MOSI=45
	-DTFT_SCLK=3
	-DTFT_MISO=46
	-DTFT_BL=-1
	-DBACKLIGHT=-1
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1
	-DTFT_DISPON=0x29
	-DTFT_DISPOFF=0x28
	-DFP=1
	-DFM=2
	-DFG=3
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	-DHAS_TOUCH=1
	-DTOUCH_CS=1
	-DTOUCH_IRQ=-1
	-DTOUCH_XPT2046_SPI
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=2
	-DXPT2046_SPI_BUS_MISO_IO_NUM=41
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=42
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=1
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=-1
	-DSPI_TOUCH_FREQUENCY=2500000
	-DHAS_BTN=0
	-DBTN_ALIAS='"Touch"'
	-DSDCARD_CS=8
	-DSDCARD_SCK=3
	-DSDCARD_MISO=46
	-DSDCARD_MOSI=45
	-DGROVE_SDA=15
	-DGROVE_SCL=16
	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=10
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=40
	-DCC1101_SS_PIN=39
	-DCC1101_MOSI_PIN=11
	-DCC1101_SCK_PIN=12
	-DCC1101_MISO_PIN=13
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=6
	-DNRF24_SS_PIN=7
	-DNRF24_MOSI_PIN=11
	-DNRF24_SCK_PIN=12
	-DNRF24_MISO_PIN=13
	-DLORA_SCK=12
	-DLORA_MOSI=11
	-DLORA_MISO=13
	-DLORA_CS=10
	-DLORA_DIO0=17
	-DLORA_RST=18
	-DLORA_BUSY=9
	-DTXLED=-1
	-DRXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DIR_TX_PINS='{{"ODG KY-005 TX GPIO4", 4}}'
	-DIR_RX_PINS='{{"ODG KY-022 RX GPIO5", 5}}'
